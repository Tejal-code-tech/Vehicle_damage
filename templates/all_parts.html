<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse All Spare Parts - AI Car Damage System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shop"></i> Browse Spare Parts
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/user/dashboard">
                            <i class="bi bi-house-fill"></i> Back to Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <span class="navbar-text me-3">
                            <i class="bi bi-person-circle"></i> {{ session.username }}
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-danger btn-sm" href="/logout">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Search and Filter Section -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-search"></i> Search Parts
                        </label>
                        <input type="text" class="form-control form-control-lg" id="searchInput" 
                               placeholder="Search by part name..." onkeyup="searchParts()">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-sort-down"></i> Sort By
                        </label>
                        <select class="form-select form-select-lg" id="sortSelect" onchange="sortParts()">
                            <option value="price_low">Price: Low to High</option>
                            <option value="price_high">Price: High to Low</option>
                            <option value="nearest">Nearest Store</option>
                            <option value="name">Name: A-Z</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-geo-alt-fill"></i> Location
                        </label>
                        <button class="btn btn-outline-primary btn-lg w-100" onclick="getMyLocation()">
                            <i class="bi bi-compass"></i> Detect Location
                        </button>
                    </div>
                </div>
                <div id="locationStatus" class="mt-2"></div>
            </div>
        </div>

        <!-- Parts Grid -->
        <div class="row mb-3">
            <div class="col">
                <h4><i class="bi bi-box-seam-fill"></i> Available Spare Parts 
                    <span class="badge bg-primary" id="partsCount">0</span>
                </h4>
            </div>
        </div>

        <div id="partsList" class="row"></div>
        
        <div id="loadingMessage" class="text-center my-5" style="display:none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading spare parts...</p>
        </div>
        
        <div id="noPartsMessage" style="display:none;" class="text-center text-muted my-5">
            <i class="bi bi-inbox" style="font-size: 4rem;"></i>
            <p class="mt-3 fs-5">No spare parts found.</p>
        </div>
    </div>

    <script>
        let allParts = [];
        let userLocation = null;

        // Load parts on page load
        window.addEventListener('load', function() {
            loadAllParts();
        });

        async function loadAllParts() {
            document.getElementById('loadingMessage').style.display = 'block';
            
            try {
                const url = userLocation ? 
                    `/api/get_parts_with_location?lat=${userLocation.lat}&lng=${userLocation.lng}` :
                    '/api/get_all_parts';
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    allParts = data.parts;
                    displayParts(allParts);
                }
            } catch (error) {
                console.error('Error loading parts:', error);
                document.getElementById('noPartsMessage').style.display = 'block';
            } finally {
                document.getElementById('loadingMessage').style.display = 'none';
            }
        }

        function getMyLocation() {
            const statusDiv = document.getElementById('locationStatus');
            
            if (!navigator.geolocation) {
                statusDiv.innerHTML = '<div class="alert alert-danger">Geolocation is not supported by your browser</div>';
                return;
            }

            statusDiv.innerHTML = '<div class="alert alert-info"><i class="bi bi-hourglass-split"></i> Detecting your location...</div>';

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    
                    statusDiv.innerHTML = `
                        <div class="alert alert-success">
                            <i class="bi bi-check-circle-fill"></i> Location detected! 
                            <small>(${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)})</small>
                        </div>
                    `;
                    
                    // Reload parts with location
                    loadAllParts();
                    
                    // Auto-select "Nearest Store" sorting
                    document.getElementById('sortSelect').value = 'nearest';
                    sortParts();
                },
                function(error) {
                    statusDiv.innerHTML = '<div class="alert alert-warning">Could not detect location. Showing all stores.</div>';
                    console.error('Geolocation error:', error);
                }
            );
        }

        function displayParts(parts) {
            const partsList = document.getElementById('partsList');
            const noPartsMsg = document.getElementById('noPartsMessage');
            const partsCount = document.getElementById('partsCount');
            
            partsCount.textContent = parts.length;
            
            if (parts.length === 0) {
                partsList.innerHTML = '';
                noPartsMsg.style.display = 'block';
                return;
            }
            
            noPartsMsg.style.display = 'none';
            partsList.innerHTML = '';
            
            parts.forEach(part => {
                const distanceBadge = part.distance_km ? 
                    `<span class="badge bg-success">
                        <i class="bi bi-geo-alt-fill"></i> ${part.distance_km} km away
                    </span>` : '';
                
                partsList.innerHTML += `
                    <div class="col-md-4 col-lg-3 mb-4">
                        <div class="card h-100 shadow-sm hover-card">
                            ${part.image_path ? 
                                `<img src="/${part.image_path}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="${part.part_name}">` : 
                                '<div class="bg-secondary text-white text-center p-5"><i class="bi bi-image" style="font-size: 3rem;"></i></div>'
                            }
                            <div class="card-body">
                                <h5 class="card-title text-primary">
                                    <i class="bi bi-gear-fill"></i> ${part.part_name.toUpperCase()}
                                </h5>
                                ${distanceBadge}
                                <hr>
                                <div class="mb-2">
                                    <strong class="text-success fs-4">
                                        <i class="bi bi-currency-rupee"></i>${part.price.toLocaleString()}
                                    </strong>
                                </div>
                                <p class="card-text small">
                                    <i class="bi bi-shop"></i> <strong>${part.shop_name}</strong><br>
                                    <i class="bi bi-geo-alt"></i> ${part.address}<br>
                                    <i class="bi bi-telephone"></i> ${part.contact_number}
                                    ${part.car_model ? `<br><i class="bi bi-car-front"></i> ${part.car_model}` : ''}
                                </p>
                            </div>
                            <div class="card-footer bg-white">
                                <button class="btn btn-primary w-100" 
                                        onclick="notifyShop(${part.shop_id}, '${part.part_name}')">
                                    <i class="bi bi-bell-fill"></i> Contact Shop
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function searchParts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            if (query === '') {
                displayParts(allParts);
                return;
            }
            
            const filtered = allParts.filter(part => 
                part.part_name.toLowerCase().includes(query) ||
                part.shop_name.toLowerCase().includes(query) ||
                (part.car_model && part.car_model.toLowerCase().includes(query))
            );
            
            displayParts(filtered);
        }

        function sortParts() {
            const sortBy = document.getElementById('sortSelect').value;
            let sorted = [...allParts];
            
            switch(sortBy) {
                case 'price_low':
                    sorted.sort((a, b) => a.price - b.price);
                    break;
                case 'price_high':
                    sorted.sort((a, b) => b.price - a.price);
                    break;
                case 'nearest':
                    if (userLocation) {
                        sorted.sort((a, b) => (a.distance_km || 999) - (b.distance_km || 999));
                    } else {
                        alert('Please detect your location first to sort by nearest store!');
                        document.getElementById('sortSelect').value = 'price_low';
                        return;
                    }
                    break;
                case 'name':
                    sorted.sort((a, b) => a.part_name.localeCompare(b.part_name));
                    break;
            }
            
            allParts = sorted;
            displayParts(sorted);
        }

        async function notifyShop(shopId, partName) {
            try {
                const response = await fetch('/api/notify_shop', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({shop_id: shopId, part_name: partName})
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Shop owner has been notified! They will contact you soon.');
                } else {
                    alert('❌ Failed to notify shop');
                }
            } catch (error) {
                alert('❌ Error sending notification');
            }
        }
    </script>

    <style>
        .hover-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .hover-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2) !important;
        }
        .card-img-top {
            border-bottom: 3px solid #0d6efd;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
